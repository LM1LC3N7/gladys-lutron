# -----------------------------------------------------------------------------
# Continuous integration: runs on every push to main and every pull request.
#
# Gates:
#   1. Prettier  -> consistent formatting;
#   2. ESLint    -> real mistakes + the layering rule (src/leap/ stays
#                   independent from Gladys);
#   3. Tests     -> `node --test` with coverage thresholds, on Node 22 and 24;
#   4. Audit     -> no known high or critical vulnerability in the runtime
#                   dependencies shipped in the image;
#   5. Manifest  -> the official Gladys store validator (image check skipped:
#                   the image only exists once released);
#   6. Docker    -> the image still builds (amd64 only, nothing is pushed,
#                   base image pulled through mirror.gcr.io).
#
# Actions are pinned by commit SHA (a moved tag cannot change what runs);
# Dependabot proposes the updates (.github/dependabot.yml).
#
# If EVERY job fails in under 2 seconds, the Actions quota is exhausted: it is
# not a code problem.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Read-only token: CI only checks out and builds, it never writes.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Audit the runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  manifest:
    runs-on: ubuntu-latest
    name: Gladys store validation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate the manifest like the store indexer does
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker Hub rate-limits (429) and times out the anonymous pulls of the
      # shared runners. The check only needs to prove the image builds, so the
      # runner's own daemon builds it (no BuildKit image to pull) and fetches
      # the base image through mirror.gcr.io, Google's public cache of Docker
      # Hub. The Dockerfile and the published images are unchanged.
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          config=/etc/docker/daemon.json
          current="$( [ -s "$config" ] && sudo cat "$config" || echo '{}' )"
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' \
            | sudo tee "$config" > /dev/null
          sudo systemctl restart docker

      - name: Build the image (not pushed)
        run: docker build --tag gladys-lutron:ci .
